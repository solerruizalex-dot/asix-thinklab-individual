# dnsmasq en el router Debian: solo DNS para la LAN
# El DHCP de la LAN lo da el MikroTik (192.168.36.1); tener tres DHCP en la misma red daba IPs con puertas de enlace distintas.
interface=enp0s8
bind-interfaces
domain-needed
bogus-priv
# para reactivar el DHCP si este router pasa a ser el principal:
#dhcp-range=192.168.36.100,192.168.36.200,255.255.255.0,12h
#dhcp-option=3,192.168.36.3
#dhcp-option=6,192.168.36.3
