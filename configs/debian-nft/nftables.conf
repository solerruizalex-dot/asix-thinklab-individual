#!/usr/sbin/nft -f
# Router/cortafuegos Debian - Álex Soler
# WAN: enp0s3 (NAT VirtualBox, DHCP)   LAN: enp0s8 192.168.36.3/24
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;
        iif lo accept
        ct state established,related accept
        ct state invalid drop
        ip protocol icmp accept
        udp dport 68 accept
        iifname "enp0s8" tcp dport 22 accept
        # gestion desde el anfitrion (en el NAT de VirtualBox el host es 10.0.2.2)
        iifname "enp0s3" ip saddr 10.0.2.2 tcp dport 22 accept
        iifname "enp0s8" udp dport { 53, 67 } accept
        iifname "enp0s8" tcp dport 53 accept
        log prefix "NFT-INPUT-DROP " limit rate 5/minute
    }
    chain forward {
        type filter hook forward priority 0; policy drop;
        ct state established,related accept
        # prueba de conexion bloqueada: telnet y SMB hacia fuera no se permiten
        iifname "enp0s8" oifname "enp0s3" tcp dport { 23, 445 } log prefix "NFT-BLOQ " drop
        iifname "enp0s8" oifname "enp0s3" accept
    }
    chain output {
        type filter hook output priority 0; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;
        oifname "enp0s3" masquerade
    }
}
